# Will Treinos PRO — CI Fase 1A
# Gates reais de Pull Request antes de merge em main.
# Ver: docs/WILL_RELEASE_PIPELINE_PLAN_2026_09.md (§17 Fase 1A)
#      docs/WILL_CI_FASE_1A.md
#
# Nomes dos jobs = nomes dos required checks no GitHub Branch Protection.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_POSTHOG_HOST: https://us.posthog.com
  # Build de PR/CI usa URL local — nunca produção como base de escrita E2E.
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Next.js
        run: pnpm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          # Nome do secret mantido por compatibilidade; o valor deve ser uma
          # Supabase Publishable Key moderna (sb_publishable_...), nunca a
          # legacy anon JWT — ver scripts/set-github-ci-secrets.mjs.
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_DEV_ROOT_EMAILS: ${{ secrets.NEXT_PUBLIC_DEV_ROOT_EMAILS }}
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_POSTHOG_HOST: https://us.posthog.com

  e2e-smoke:
    name: E2E Smoke (chromium)
    runs-on: ubuntu-latest
    needs: build
    # Roda em todo PR e em push na main — sem apontar writes para produção.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build para smoke local
        run: pnpm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_DEV_ROOT_EMAILS: ${{ secrets.NEXT_PUBLIC_DEV_ROOT_EMAILS }}
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_POSTHOG_HOST: https://us.posthog.com
      - name: Instalar Chromium (Playwright)
        run: pnpm exec playwright install --with-deps chromium
      - name: Subir app (next start)
        run: |
          nohup pnpm exec next start -H 127.0.0.1 -p 3000 > /tmp/will-next.log 2>&1 &
          echo $! > /tmp/will-next.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/api/health >/dev/null; then
              echo "App pronto em http://127.0.0.1:3000"
              exit 0
            fi
            sleep 2
          done
          echo "Timeout aguardando /api/health"
          cat /tmp/will-next.log || true
          exit 1
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          PORT: "3000"
      - name: Smoke E2E público (sem credenciais)
        run: >
          pnpm exec playwright test
          e2e/student-journey.spec.ts
          e2e/auth.spec.ts
          --project=chromium
        env:
          # NUNCA produção neste job — evita poluir dados reais.
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          # Explicitamente ausente: suites autenticadas NÃO rodam aqui.
          # PLAYWRIGHT_TEST_CREDS / TEST_*_EMAIL → Fase 1B + staging.
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7
      - name: Encerrar app
        if: always()
        run: |
          if [ -f /tmp/will-next.pid ]; then
            kill "$(cat /tmp/will-next.pid)" 2>/dev/null || true
          fi

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Binário oficial (sem licença da Action comercial em repo privado).
      - name: Instalar Gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      # Gate obrigatório: somente commits NOVOS do PR/push.
      # Histórico legado NÃO derruba o merge — ver workflow gitleaks-full-history.yml.
      - name: Definir range de commits
        id: range
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            echo "log_opts=${BASE}..${HEAD}" >> "$GITHUB_OUTPUT"
            echo "Escopo PR: ${BASE}..${HEAD}"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            ZERO="0000000000000000000000000000000000000000"
            if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "${ZERO}" ]; then
              echo "log_opts=${AFTER}^!" >> "$GITHUB_OUTPUT"
              echo "Escopo push (sem before): commit único ${AFTER}"
            else
              echo "log_opts=${BEFORE}..${AFTER}" >> "$GITHUB_OUTPUT"
              echo "Escopo push: ${BEFORE}..${AFTER}"
            fi
          fi
      - name: Scan de secrets novos (range)
        run: |
          set -euo pipefail
          gitleaks detect \
            --source . \
            --verbose \
            --redact \
            --config .gitleaks.toml \
            --log-opts="${{ steps.range.outputs.log_opts }}"
      - name: Self-test — secret fake novo deve falhar
        run: |
          set -euo pipefail
          FIXTURE="$(mktemp -d)"
          # Payload em base64 (JWT de exemplo jwt.io) — evita versionar o token no Git.
          echo 'VE9LRU49ZXlKaGJHY2lPaUpJVXpJMU5pSXNJblI1Y0NJNklrcFhWQ0o5LmV5SnpkV0lpT2lJeE1qTTBOVFkzT0Rrd0lpd2libUZ0WlNJNklrcHZhRzRnUkc5bElpd2lhV0YwSWpveE5URTJNak01TURJeWZRLlNmbEt4d1JKU01lS0tGMlFUNGZ3cE1lSmYzNlBPazZ5SlZfYWRRc3N3NWMK' \
            | base64 -d > "${FIXTURE}/fake-secret.env"
          if gitleaks detect --source "${FIXTURE}" --no-git --redact --config .gitleaks.toml; then
            echo "::error::Self-test falhou: Gitleaks deveria detectar secret fake novo"
            rm -rf "${FIXTURE}"
            exit 1
          fi
          rm -rf "${FIXTURE}"
          echo "OK: gate detecta secret novo (fixture sintética JWT)"

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # O exit code nativo do `pnpm audit` NÃO decide o gate sozinho — ele
      # sempre é != 0 quando há qualquer vulnerabilidade (mesmo as baseline
      # conhecidas de @ducanh2912/next-pwa), por isso capturamos o JSON aqui
      # e quem decide passa/falha é o checker abaixo.
      - name: Gerar relatório de auditoria (JSON)
        run: pnpm audit --json > dependency-audit-report.json || true
      - name: Gate de auditoria de dependências (baseline-aware)
        run: node scripts/ci/check-dependency-audit.mjs dependency-audit-report.json security/dependency-audit-allowlist.json
      - name: Self-tests do gate de auditoria
        run: node scripts/ci/check-dependency-audit.selftest.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-report
          path: dependency-audit-report.json
          retention-days: 14

  rls-audit:
    name: RLS Audit (experimental)
    runs-on: ubuntu-latest
    # Fase 1A: NÃO é required check. Schema vazio ainda pode gerar falso-verde;
    # job marcado experimental até migrations reais no CI (Fase 1B).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ankane/setup-postgres@v1
        with:
          postgres-version: 15
      - name: Aviso — job experimental
        run: |
          echo "::warning::RLS Audit é experimental na Fase 1A (Postgres sem migrations)."
          echo "Não usar como required check até a Fase 1B."
      - name: Executar script RLS
        run: psql postgres://postgres:postgres@localhost/postgres -f supabase/rls-audit.sql 2>&1 | tee rls-audit.log
        continue-on-error: true
      - name: Avaliar saída
        run: |
          if grep -q "FAILED" rls-audit.log 2>/dev/null; then
            echo "⚠️ Issues RLS no log — revisar (job experimental, não bloqueia merge na 1A)"
            cat rls-audit.log
            exit 1
          fi
          echo "ℹ️ Sem FAILED no log — NÃO significa RLS OK em produção (schema CI incompleto)."
          cat rls-audit.log
