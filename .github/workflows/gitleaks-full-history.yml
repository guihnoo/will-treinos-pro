# Auditoria Gitleaks full-history — legado (NÃO required).
# O gate obrigatório de PR/push está em ci.yml (scan por range).
# Ver: docs/WILL_GITLEAKS_SPRINT_0D.md
#
# Uso: Actions → Gitleaks Full History → Run workflow
# Sempre com --redact. Não imprimir valores de secrets.

name: Gitleaks Full History

on:
  workflow_dispatch:

jobs:
  gitleaks-full-history:
    name: Gitleaks Full History (legado)
    runs-on: ubuntu-latest
    # Explicitamente NÃO é required check / branch protection.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar Gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan full-history (redacted)
        run: |
          set -euo pipefail
          echo "::warning::Job legado — findings históricos não bloqueiam merge. Ver docs/WILL_GITLEAKS_SPRINT_0D.md"
          # Relatório JSON sem ecoar secrets no log do step (arquivo local no runner).
          set +e
          gitleaks detect \
            --source . \
            --redact \
            --no-banner \
            --config .gitleaks.toml \
            --report-format json \
            --report-path /tmp/gitleaks-full.json
          code=$?
          set -e
          if [ -f /tmp/gitleaks-full.json ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/gitleaks-full.json").read_text(encoding="utf-8") or "[]")
          print(f"Findings (metadados apenas): {len(data)}")
          for i, f in enumerate(data, 1):
              print(
                  f"{i}. rule={f.get('RuleID')} file={f.get('File')} "
                  f"commit={str(f.get('Commit') or '')[:12]} line={f.get('StartLine')} "
                  f"fingerprint={f.get('Fingerprint')}"
              )
          PY
          fi
          exit "$code"
      - name: Upload relatório redigido (metadados)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-full-history-report
          path: /tmp/gitleaks-full.json
          retention-days: 14
          if-no-files-found: ignore
